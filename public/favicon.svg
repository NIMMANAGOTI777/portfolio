<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Dark Navy / Black Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- KN Purple-to-Pink Radiant Gradient -->
    <linearGradient id="knGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded Square Body -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle Ambient Glow Behind Letters -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- High-end Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Bold Geometric "KN" Monogram (Optimized for 16x16 and 32x32 legibility) -->
  <g fill="none" stroke="url(#knGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter K -->
    <path d="M 124 144 V 368" />
    <path d="M 238 144 L 132 256 L 238 368" />
    <!-- Letter N -->
    <path d="M 302 368 V 144 L 392 368 V 144" />
  </g>
</svg>